  path: /data1/xuhuixin/ula/tra_pipe/RoboTwin/envs/handover_mic.py
  sha256: 41ed0f2561cc8f1ae2449ba405decd4f5d7e3b80243b60921598657551891b17
  methods:
  - "def check_success(self):\n        microphone_pose = self.microphone.get_functional_point(0)\n\
    \        contact = self.get_gripper_actor_contact_position(\"018_microphone\"\
    )\n        if len(contact) == 0:\n            return False\n        close_gripper_func\
    \ = self.is_left_gripper_close if self.handover_arm_tag == \"left\" else self.is_right_gripper_close\n\
    \        open_gripper_func = self.is_left_gripper_open if self.grasp_arm_tag ==\
    \ \"left\" else self.is_right_gripper_open\n        tag = microphone_pose[0] <\
    \ 0 if self.handover_arm_tag == \"left\" else microphone_pose[0] > 0\n       \
    \ return (close_gripper_func() and open_gripper_func() and microphone_pose[2]\
    \ > 0.92 and tag)"
