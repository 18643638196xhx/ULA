  - "def check_success(self):\n        pot_pose = self.pot.get_pose().p\n        can_pose\
    \ = self.can.get_pose().p\n        can_pose_rpy = t3d.euler.quat2euler(self.can.get_pose().q)\n\
    \        x_rotate = can_pose_rpy[0] * 180 / np.pi\n        y_rotate = can_pose_rpy[1]\
    \ * 180 / np.pi\n        eps = np.array([0.2, 0.035, 15, 15])\n        dis = (pot_pose[0]\
    \ - can_pose[0] if self.arm_tag == \"left\" else can_pose[0] - pot_pose[0])\n\
    \        check = True if dis > 0 else False\n        return (np.all(np.array([\n\
    \            abs(dis),\n            np.abs(pot_pose[1] - can_pose[1]),\n     \
    \       abs(x_rotate - 90),\n            abs(y_rotate),\n        ]) < eps) and\
    \ check and can_pose[2] <= self.orig_z + 0.001 and self.robot.is_left_gripper_open()\n\
    \                and self.robot.is_right_gripper_open())"
