   <g id="text_1">
    <text style="font-weight: 700; font-size: 24px; font-family: 'WenQuanYi Micro Hei'; text-anchor: middle; fill: #086bca" x="144" y="72.834375" transform="rotate(-0 144 72.834375)">VLA 闭爪候选</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 24px; font-family: 'WenQuanYi Micro Hei'; text-anchor: middle; fill: #086bca" x="432" y="72.834375" transform="rotate(-0 432 72.834375)">传统试抬</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 24px; font-family: 'WenQuanYi Micro Hei'; text-anchor: middle; fill: #086bca" x="720" y="72.834375" transform="rotate(-0 720 72.834375)">视觉跟手确认</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 20.057745px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(56.436975 186.329058)">闭爪控制状态 &lt;0.05</text>
    <text style="font-weight: 700; font-size: 20.057745px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(83.120043 214.010313)">连续 3 个动作</text>
    <text style="font-weight: 700; font-size: 20.057745px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(33.682403 241.691567)">只允许尝试，不证明抓稳</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 20.057745px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(327.434902 186.329058)">先保存可信 RGB-D 基准</text>
    <text style="font-weight: 700; font-size: 20.057745px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(336.727279 214.010313)">再向上 5 cm，分 3 段</text>
    <text style="font-weight: 700; font-size: 20.057745px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(321.682403 241.691567)">机器人状态检查末端到位</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 17.73913px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(622.434783 188.92663)">匹配前后表面，估计上移</text>
    <text style="font-weight: 700; font-size: 17.73913px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(609.756848 213.408016)">至少 3 cm，方向与大小一致</text>
    <text style="font-weight: 700; font-size: 17.73913px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(631.304348 237.889402)">通过后才进入传统放置</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 22px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(213.179063 352.333984)">观测不可信：有限次重新分割 / 匹配腕部视角</text>
    <text style="font-weight: 700; font-size: 22px; font-family: 'WenQuanYi Micro Hei'; fill: #086bca" transform="translate(223 382.695703)">仍不通过：停止，不进入放置、不主动释放</text>
   </g>
   <g id="text_8">
    <text style="font-size: 14px; font-family: 'WenQuanYi Micro Hei'; text-anchor: start; fill: #60717f" x="25.92" y="439.236719" transform="rotate(-0 25.92 439.236719)">不读取杯子位姿与物理接触，不恢复严格滑移门槛；视觉启发式不等于物理抓稳证明。</text>
   </g>
  </g>
