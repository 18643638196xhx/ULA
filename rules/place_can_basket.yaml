schema_version: 1
task: place_can_basket

entities:
  manipulated_object: can
  support_target: basket

stages:
  - controller: traditional
    operation: approach_manipulated_object
  - controller: vla
    operation: local_grasp
  - controller: traditional
    operation: container_placement

placement:
  controller: container
  support_type: container
  candidate_budget: 6
  safe_escape: measured_scene_corridor
  target_anchor: container_interior
  release_mode: drop_into
  desired_orientation: initial_world

targets:
  - object: can
    slot: basket.interior


dual_arm:
  main_arm: auto
  place:
    object: can
    arm: main
  hold:
    object: basket
    arm: opposite

release:
  require:
    - object_in_container
    - support_contact_observed
  retreat: selected_precontact

success:
  source: env.check_success
  criteria:
    - object_in_container: {max_distance_m: 0.15, require_contact: true}
    - object_not_on_table: true
    - container_upright: true
    - container_lifted: {min_dz_m: 0.02}
    - object_lifted: {min_dz_m: 0.02}

truth_policy:
  simulator_truth_for_control: false
  simulator_truth_for_final_evaluation: true
