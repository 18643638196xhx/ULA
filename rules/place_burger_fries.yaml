schema_version: 1
task: place_burger_fries

entities:
  manipulated_object: hamburg
  support_target: tray

stages:
  - controller: traditional
    operation: approach_manipulated_object
  - controller: vla
    operation: local_grasp
  - controller: traditional
    operation: container_placement

placement:
  controller: container
  support_type: container
  candidate_budget: 6
  safe_escape: measured_scene_corridor
  target_anchor: container_functional_point
  release_mode: drop_into
  desired_orientation: initial_world

targets:
  - object: hamburg
    slot: tray.functional_point[0]
    tolerance_m: 0.08
  - object: frenchfries
    slot: tray.functional_point[1]
    tolerance_m: 0.08

release:
  require:
    - object_in_container
    - support_contact_observed
  retreat: selected_precontact

success:
  source: env.check_success
  criteria:
    - hamburg_at_tray_slot_0: {max_distance_m: 0.08}
    - fries_at_tray_slot_1: {max_distance_m: 0.08}

    - grippers_open: both

truth_policy:
  simulator_truth_for_control: false
  simulator_truth_for_final_evaluation: true

order: [hamburg, frenchfries]
