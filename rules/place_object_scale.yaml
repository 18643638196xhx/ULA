schema_version: 1
task: place_object_scale

entities:
  manipulated_object: object
  support_target: scale

stages:
  - controller: traditional
    operation: approach_manipulated_object
  - controller: vla
    operation: local_grasp
  - controller: traditional
    operation: adaptive_support_placement

grasp_handoff:
  detector: stable_closed_gripper_command
  stable_steps: 3
  gripper_command_threshold: 0.25
  trial_lift: false

placement:
  controller: adaptive_support
  candidate_budget: 6
  support_type: plane
  safe_escape: measured_scene_corridor
  support_anchor: lowest_visible_object_layer_at_visual_table_height
  target_anchor: measured_support_center_at_median_surface_height
  desired_orientation: initial_world
  approach_direction: support_surface_normal
  distance_source: rgbd_spacing_icp_residual_and_robot_arrival_residual
  fixed_release_gap: null

release:
  require:
    - support_contact_observed
    - footprint_contained
  retreat: selected_precontact

truth_policy:
  simulator_truth_for_control: false
  simulator_truth_for_final_evaluation: true

success:
  source: env.check_success
  position:
    axes: [x, y]
    tolerance_m: 0.035
    z_rule: "object_z > scale_z - 0.01"
  grippers_open: active
